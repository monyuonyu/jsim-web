# 小さなモデル: 到着 → 待ち行列 → 作業台 → 出口（1000 時間）。Java 版と結果を突き合わせる
Define ExponentialDistribution { Arrive }
Define UniformDistribution { Work }
Define EntityGenerator { Gen }
Define Queue { Q }
Define Server { Srv }
Define EntitySink { Out }
Define SimEntity { Part }

Arrive UnitType { TimeUnit }
Work UnitType { TimeUnit }

Simulation RunDuration { 1000 h }
Simulation RunOutputList { { [Out].NumberAdded } { [Q].AverageQueueTime/1[min] } { [Srv].Utilisation } }

Arrive RandomSeed { 1 }
Arrive Mean { 5 min }
Work RandomSeed { 2 }
Work MinValue { 2 min }
Work MaxValue { 6 min }

Gen NextComponent { Q }
Gen InterArrivalTime { Arrive }
Gen PrototypeEntity { Part }
Q NextComponent { Srv }
Srv WaitQueue { Q }
Srv ServiceTime { Work }
Srv NextComponent { Out }
